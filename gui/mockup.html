<head>
  <title>MPE Emulator plugin GUI mockup</title>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="description" content="MPE Emulator plugin GUI mockup" />

<style>
* {
  padding: 0;
  margin: 0;
}

html, body {
  background: #151520;
  color: #b8b8c0;
  font-family: Verdana, Sans-Serif;
}

.background {
  width: 1960px;
  height: 1200px;
  margin: 20px;
  border: solid 2px green;
  overflow: hidden;
  position: relative;
}

.border {
  background: radial-gradient(1120px at 1400px 1200px, #404050, #282836);
  background: radial-gradient(1120px at 1400px 1200px, #343448, #20202c);
  margin: 4px;
  padding: 4px;
  width: 1936px;
  height: 1124px;
  border: solid 4px #5c5c60;
  border-radius: 0 12px 12px 12px;
  text-align: center;
}

#zone1 .main-block {
  margin: 15px 18px;
  padding: 2px 4px;
}

.block {
  display: inline-block;
  box-shadow: inset 0 12px 24px #05070b;
  padding: 4px;
  margin: 4px;
  border: inset 2px #808098;
  border-radius: 12px;
  background: #000000;
  text-align: left;
}

.block.main-block {
  box-shadow: none;
}

.main-block {
  background: radial-gradient(880px at 840px 240px, #505060, #404050);
  filter: drop-shadow(6px 6px 8px #030408);
  border: outset 2px #9090b0;
  margin: 2px;
  padding: 4px;
}

#zone1 .main-block h1 label {
  height: 55px;
  line-height: 50px;
}

#zone1 .main-block h1 {
  padding-top: 0;
  padding-bottom: 0;
}

.main-block .block {
  margin: 4px 0;
}

.main-block > h1 {
  color: #d0d0e0;
}

.block h1 {
  padding: 2px 4px;
  font-size: 28px;
  font-weight: bold;
  height: 50px;
  line-height: 50px;
}

.block h1 label {
  display: inline-block;
  height: 50px;
  line-height: 50px;
  overflow: hidden;
  font-size: 24px;
  font-weight: normal;
  vertical-align: bottom;
}

.block h1 label.toggle {
  margin-right: 2px;
  float: right;
}

.block h1 label.toggle.rule span {
  padding-right: 4px;
}

.block h1 label.toggle input {
  top: -3px;
}

.block h1 input {
  position: relative;
  background-color: black;
  border: inset 4px #889;
  width: 34px;
  height: 24px;
  border-radius: 10px;
  top: 0;
  filter: none;
}

.block h1 label.rule {
  margin-left: 12px;
}

.block h1 label.dist {
  float: right;
}

.block h1 label.dist input {
  width: 92px;
  height: 46px;
  margin-top: -6px;
  border: inset 2px #9090b0;
}

.block h1 label.reset {
  margin-right: 2px;
  float: right;
}

.block h1 label.reset span,
.block h1 label.dist span {
  padding-right: 4px;
}

.block h1 label.reset input {
  width: 72px;
  height: 46px;
  margin-top: -6px;
  border: inset 2px #9090b0;
}

.knob {
  display: inline-block;
  width: 116px;
  height: 162px;
  text-align: center;
}

.knob div {
  display: inline-block;
  margin: 4px auto;
  border-radius: 50%;
  background: #3d3d40;
  width: 72px;
  height: 72px;
  border: outset 4px #727280;
  background: linear-gradient(320deg, rgba(32,32,36,1) 28%, rgba(106,106,111,1) 72%, rgba(72,72,77,1) 100%);
}

.knob span {
  display: block;
  font-size: 24px;
  line-height: 28px;
  height: 28px;
}

.knob span:nth-child(4) {
  display: block;
  font-size: 22px;
}

.knob select,
.knob div,
.knob span:nth-child(4) {
  opacity: 1.0;
}

body.hide-objects .knob select,
body.hide-objects .knob div,
body.hide-objects .knob span:nth-child(3) {
  opacity: 0.0;
}

.select-container {
  display: inline-block;
  width: 232px;
  height: 136px;
  overflow: hidden;
}

.select {
  display: inline-block;
  width: 232px;
  height: 54px;
  margin-bottom: 8px;
  margin-top: 8px;
}

.select span {
  display: inline-block;
  width: 60px;
  font-size: 24px;
  line-height: 24px;
  height: 54px;
  margin-right: 6px;
  text-align: right;
  padding-top: 14px;
}

.select div {
  display: inline-block;
  border: inset 4px #808098;
  border-radius: 10px;
  width: 144px;
  height: 46px;
  margin: 0;
  position: relative;
  top: -14px;
}

.tabs {
  margin: 4px 0 0 4px;
}

.tab {
  position: relative;
  display: inline-block;
  font-family: Arial, Sans-serif;
  font-size: 28px;
  background: #202030;
  width: 128px;
  height: 40px;
  line-height: 44px;
  margin: 0;
  padding: 4px 6px;
  border: solid 4px #5c5c60;
  border-radius: 12px 12px 0 0;
  margin-bottom: -8px;
  margin-left: -4px;
  color: #a0a0b0;
}

.tab:nth-child(2) {
  margin-left: 0;
}

.tab.active {
  font-weight: bold;
  background: #20202c;
  color: #c0c0ca;
}

.tab.active:after {
  background: #20202c;
  position: absolute;
  bottom: -4px;
  left: 0px;
  height: 4px;
  width: 100%;
  content: "";
}

#export-import {
  width: 50px;
  display: inline-block;
  vertical-align: top;
}

svg.icon {
  padding: 0;
  margin: 0;
  border-width: 0;
  width: 50px;
  height: 50px;
}

.last-tab {
  font-size: 28px;
  font-family: Verdana, Sans-serif;
  text-align: right;
  float: right;
  margin-right: 10px;
  line-height: 40px;
}

.border > span {
  font-size: 24px;
  z-index: 2000;
  filter: drop-shadow(4px 4px 2px #030408);
}

#relvel,
#mcm {
  margin-left: 20px;
}

h1 span {
  filter: drop-shadow(4px 4px 2px #000000);
}

.resizer {
  cursor: nwse-resize;
  width: 64px;
  height: 64px;
  position: absolute;
  right: 0px;
  bottom: 0px;
  margin: 0;
  padding: 0;
}

.resizer svg {
  width: 64px;
  height: 64px;
  margin: 0;
}

#resizer-tpl {
  padding: 40px;
}

#resizer-tpl svg {
  width: 240px;
  height: 240px;
}

</style>
</head>
<body>

<script type="text/javascript">
<!--
function make_tabs(active)
{
    var tabs = [
            "Settings",
            "About"
        ],
        i, l;

    for (i = 0, l = tabs.length; i < l; ++i) {
        document.write(

    }

    document.write('<div class="last-tab"><strong>MPE Emulator</strong> (GPLv3)</div>');;

</script>

  <div class="background">
    <div class="tabs">
      <script type="text/javascript">make_tabs(0);</script>
    </div>
    <div class="border" id="zone1">
      <div id="main" class="main-block block">
        <h1>
          <span>Main</span>
          <label id="mcm" class="toggle">
            <span>MCM </span><input type="text" />
          </label>
          <label id="relvel" class="toggle">
            <span>RelVel=TrigVel </span><input type="text" />
          </label>
          <label class="toggle">
            <span>Sustain Pedal </span><input type="text" />
          </label>
        </h1>
        <div id="main-body" class="block">
          <div id="export-import">
            <svg class="icon" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
             <g>
              <title>Open</title>
              <path
                d="M50,120 L150,120 L200,170 L380,170 L380,250 M350,450 L50,450 L50,120 M50,450 L150,250 L450,250 L350,450"
                opacity="1"
                stroke-width="50"
                stroke-linecap="round" stroke-linejoin="round"
                stroke="#b8b8c0" fill="none"/>
             </g>
            </svg>
            <svg class="icon" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
             <g>
              <title>Save</title>
              <path
                d="M250,120 L250,320 M140,220 L250,350 M360,220 L250,350 M80,350 L80,450 L420,450 L420,350"
                opacity="1"
                stroke-width="50"
                stroke-linecap="round" stroke-linejoin="round"
                stroke="#b8b8c0" fill="none"/>
             </g>
            </svg>
          </div>
        </div>
      </div>
      <br />
    </div>
    <div class="resizer"></div>
  </div>

  <div class="background">
    <div class="tabs">
      <script type="text/javascript">make_tabs(1);</script>
    </div>
    <div class="border" id="about">
    </div>
    <div class="resizer"></div>
  </div>

  <div id="resizer-tpl">
    <svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
     <g>
      <polygon points="0,320 320,0 320,320" fill="#000000" stroke-width="0" />
      <path
        d="M95,290 L290,95 M170,290 L290,170 M245,290 L290,245"
        opacity="1"
        stroke-width="25"
        stroke-linecap="round" stroke-linejoin="round"
        stroke="#b8b8c0" fill="none"/>
     </g>
    </svg>
  </div>

<script type="text/javascript">
<!--

(function ()
{

function $(obj)
{
    return (typeof(obj) === "string") ? document.getElementById(obj) : obj;
}

function create_knob(container, label_text, value_text)
{
    var knob_container = document.createElement("div"),
        knob = document.createElement("div"),
        label = document.createElement("span"),
        value = document.createElement("span");

    label.setAttribute("class", "label");

    label.innerHTML = label_text;
    value.innerHTML = value_text;

    knob_container.appendChild(label);
    knob_container.appendChild(knob);

    knob_container.setAttribute("class", "knob");

    knob_container.appendChild(value);

    $(container).appendChild(knob_container);
}

function create_select(container, label_text, value_text)
{
    var select_container = document.createElement("div"),
        select = document.createElement("div"),
        label = document.createElement("span");

    label.setAttribute("class", "label");

    label.innerHTML = label_text;
    select.innerHTML = value_text;

    select_container.appendChild(label);
    select_container.appendChild(select);

    select_container.setAttribute("class", "select");

    $(container).appendChild(select_container);
}

window.onload = function ()
{
    var i, o, s, d, h, k1, k2, k3, l, l2, n2, l3, n3;

    if (String(window.location).match(/#hide/)) {
        document.getElementsByTagName("body")[0].setAttribute("class", "hide-objects");
    }

    create_knob("main-body", "ZONE", "lower");
    create_knob("main-body", "CHAN", "15");
    create_knob("main-body", "STEAL", "oldest");
    create_knob("main-body", "ANCH", "C4");
    create_knob("main-body", "TR BA st", "-12");
    create_knob("main-body", "TR AA st", "+12");

    for (i = 1; i <= 9; ++i) {
        d = document.createElement("div");
        d.setAttribute("class", "main-block block");
        k1 = document.createElement("div");
        k1.setAttribute("class", "block");
        h = document.createElement("h1");
        h.innerHTML = [
          '<span>Rule ' + String(i) + '</span>',
          '<label class="dist rule">',
            '<span>Dist</span><input type="text" />',
          '</label>',
          '<label class="reset rule">',
            '<span>Res</span><input type="text" />',
          '</label>',
          '<label class="toggle rule">',
            '<span>Inv</span><input type="text" />',
          '</label>',
          '<label class="toggle rule">',
            '<span>FB</span><input type="text" />',
          '</label>',
        ].join("");

        d.appendChild(h);
        d.appendChild(k1);

        k2 = document.createElement("div");
        k2.setAttribute("class", "select-container");

        create_select(k2, "IN", "&nbsp;");
        create_select(k2, "OUT", "&nbsp;");
        k1.appendChild(k2);

        create_knob(k1, "INIT %", "63");
        create_knob(k1, "TARGET", "New");
        create_knob(k1, "DIST %", "10.00");

        $("zone1").appendChild(d);
    }

    o = document.getElementsByClassName("resizer");
    s = $("resizer-tpl");

    for (i = 0; i < o.length; ++i) {
      o[i].innerHTML = s.innerHTML;
    }
};

})();

//-->
</script>

</body>
</html>
